# Ambiente de DESARROLLO (laptop)
# Uso: docker compose -f infra/docker-compose.dev.yml up -d
# Los servicios Java se ejecutan desde el IDE con el perfil "dev" y se conectan a estos contenedores.

name: pni-hce-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pnihce
      POSTGRES_USER: pnihce
      POSTGRES_PASSWORD: pnihce_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pnihce -d pnihce"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # ── Simuladores de establecimientos ─────────────────────────────────────────
  posta-adapter:
    build:
      context: ../simulators/posta
      dockerfile: Dockerfile
    image: pni-hce/simulator-posta:dev
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8091/actuator/health || exit 1"]
      interval: 10s
      retries: 5

  clinica-adapter:
    build:
      context: ../simulators/clinica
      dockerfile: Dockerfile
    image: pni-hce/simulator-clinica:dev
    ports:
      - "8092:8092"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8092/actuator/health || exit 1"]
      interval: 10s
      retries: 5

  # ── Servicios Java (también se pueden levantar desde el IDE) ─────────────────
  mpi:
    build:
      context: ../services/mpi
      dockerfile: Dockerfile
    image: pni-hce/mpi:dev
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pnihce
      SPRING_DATASOURCE_USERNAME: pnihce
      SPRING_DATASOURCE_PASSWORD: pnihce_dev
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      retries: 10

  audit:
    build:
      context: ../services/audit
      dockerfile: Dockerfile
    image: pni-hce/audit:dev
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pnihce
      SPRING_DATASOURCE_USERNAME: pnihce
      SPRING_DATASOURCE_PASSWORD: pnihce_dev
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    image: pni-hce/gateway:dev
    ports:
      - "8080:8080"
    environment:
      APP_MPI_BASE_URL: http://mpi:8081
    depends_on:
      mpi: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      retries: 10

volumes:
  pg_data:

# La réplica de lectura (streaming replication) se agrega en docker-compose.qa.yml y prod,
# para no complicar el ambiente de desarrollo.
