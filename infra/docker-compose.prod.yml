# Ambiente de PRODUCCIÓN — Nodo Sur · Ayacucho
# Uso: deploy-prod.sh (llamado desde Jenkinsfile)
# Las imágenes se toman del registry; no se construyen aquí.

name: pni-hce-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pnihce
      POSTGRES_USER: pnihce
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pnihce -d pnihce"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  mpi:
    image: ${REGISTRY}/mpi:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pnihce
      SPRING_DATASOURCE_USERNAME: pnihce
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      retries: 10

  consent:
    image: ${REGISTRY}/consent:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pnihce
      SPRING_DATASOURCE_USERNAME: pnihce
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      retries: 10

  audit:
    image: ${REGISTRY}/audit:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pnihce
      SPRING_DATASOURCE_USERNAME: pnihce
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      retries: 10

  posta-adapter:
    image: ${REGISTRY}/simulator-posta:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8091/actuator/health || exit 1"]
      interval: 15s
      retries: 5

  clinica-adapter:
    image: ${REGISTRY}/simulator-clinica:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8092:8092"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8092/actuator/health || exit 1"]
      interval: 15s
      retries: 5

  gateway:
    image: ${REGISTRY}/gateway:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_MPI_BASE_URL: http://mpi:8081
      APP_CONSENT_BASE_URL: http://consent:8083
      APP_AUDIT_BASE_URL: http://audit:8082
    depends_on:
      mpi:     { condition: service_healthy }
      consent: { condition: service_healthy }
      audit:   { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      retries: 10

volumes:
  pg_data:
  redis_data:
