name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  validar-infra:
    name: Validar esquema SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pnihce
          POSTGRES_USER: pnihce
          POSTGRES_PASSWORD: pnihce_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pnihce" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar scripts de inicialización
        env:
          PGPASSWORD: pnihce_ci
        run: |
          for f in infra/postgres/init/*.sql; do
            echo "Aplicando $f"
            psql -h localhost -U pnihce -d pnihce -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Verificar particionamiento y datos de prueba
        env:
          PGPASSWORD: pnihce_ci
        run: |
          # Verificar que el DNI 71234567 ya fue insertado por el init SQL y está en la partición correcta
          psql -h localhost -U pnihce -d pnihce -t -c \
            "SELECT tableoid::regclass FROM mpi.vinculo_paciente WHERE dni='71234567';" | grep -q vinculo_paciente_p2
          # Insertar un DNI nuevo para verificar que el particionamiento funciona con ON CONFLICT
          psql -h localhost -U pnihce -d pnihce -v ON_ERROR_STOP=1 -c \
            "INSERT INTO mpi.vinculo_paciente (dni, establecimiento_id, id_local, primera_atencion, ultima_atencion)
             SELECT '99000001', id, 'TEST-CI', current_date, current_date FROM mpi.establecimiento LIMIT 1;"
          psql -h localhost -U pnihce -d pnihce -t -c \
            "SELECT tableoid::regclass FROM mpi.vinculo_paciente WHERE dni='99000001';" | grep -q vinculo_paciente_p2
          # Verificar que el hash SHA-256 del DNI de prueba está en consent
          psql -h localhost -U pnihce -d pnihce -t -c \
            "SELECT estado FROM consent.consentimiento WHERE dni_hash='62dba3eb5b6336c066e8157a60e2a1f15bd7f1675c5b0b9525169951053977ff';" | grep -q GRANTED

  build-services:
    name: Build y tests — servicios Java
    runs-on: ubuntu-latest
    needs: validar-infra
    strategy:
      matrix:
        service: [mpi, consent, audit, gateway]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: mvn verify — ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: mvn -B -ntp clean verify

      - name: Upload resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/site/jacoco/
          retention-days: 7

  build-frontend:
    name: Build Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build producción
        working-directory: frontend
        run: npx ng build --configuration=production
